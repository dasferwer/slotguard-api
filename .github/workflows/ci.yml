name: Проверки SlotGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: proof-slotguard-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: docker compose config --quiet
      - run: docker compose --profile test build test
      - run: docker compose --profile test run --rm test
      - run: docker compose --profile test run --rm test python scripts/check_migration.py
      - run: docker compose up --build -d --wait --wait-timeout 180 api
      - run: curl --fail http://localhost:8010/health
      - name: Проверка отказа при чужом HTTP-адресе и ошибки очистки
        run: uv run pytest -q scripts/test_recovery_safety.py
      - name: Восстановление снимка и проверка повторов через отдельный API
        run: uv run python scripts/recovery_smoke.py
      - if: failure()
        run: docker compose --profile test logs --tail=30
      - if: always()
        run: docker compose --profile test down -v
